---
- name: Add Helm repo for Istio
  kubernetes.core.helm_repository:
    name: istio
    repo_url: "https://istio-release.storage.googleapis.com/charts"

- name: Install Istio base
  kubernetes.core.helm:
    name: istio-base
    chart_ref: istio/base
    release_namespace: istio-system
    create_namespace: true
    state: "{{ stack_state | default('present') }}"
    wait: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Install Istio discovery (Control Plane) with OTel Tracing enabled
  kubernetes.core.helm:
    name: istiod
    chart_ref: istio/istiod
    release_namespace: istio-system
    create_namespace: true
    state: "{{ stack_state | default('present') }}"
    wait: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values:
      meshConfig:
        extensionProviders:
          - name: "otel"
            opentelemetry:
              service: "otel-gateway-collector.observability.svc.cluster.local"
              port: 4317
        defaultProviders:
          tracing:
            - "otel"
        defaultConfig:
          tracing:
            sampling: 100.0

- name: Install Istio ingress (Data Plane)
  kubernetes.core.helm:
    name: istio-ingress
    chart_ref: istio/gateway
    release_namespace: istio-ingress
    create_namespace: true
    state: "{{ stack_state | default('present') }}"
    wait: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values:
      service:
        type: NodePort

- name: Enable Istio sidecar auto-injection for the default namespace
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: default
        labels:
          istio-injection: enabled

- name: Create ServiceMonitor for Istiod control plane
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: istiod-monitor
        namespace: monitoring
        labels:
          release: prometheus-stack
      spec:
        namespaceSelector:
          matchNames:
            - istio-system
        selector:
          matchLabels:
            app: istiod
        endpoints:
          - port: http-monitoring
            interval: 15s

- name: Create PodMonitor for Envoy sidecars
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: envoy-stats-monitor
        namespace: monitoring
        labels:
          release: prometheus-stack
      spec:
        selector:
          matchExpressions:
            - key: istio-prometheus-ignore
              operator: DoesNotExist
        namespaceSelector:
          any: true
        podMetricsEndpoints:
          - path: /stats/prometheus
            port: http-envoy-prom
            interval: 15s
