---
- name: Add Helm rep for Prometheus Community
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "https://prometheus-community.github.io/helm-charts"

- name: Install Kube-Prometheus-Stack (Prometheus + Grafana)
  kubernetes.core.helm:
    name: prometheus-stack
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: monitoring
    create_namespace: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: "{{ stack_state | default('present') }}"
    wait: true
    values:
      # Grafana Configuration:
      grafana:
        enabled: true
        adminPassword: "REDACTED"
        service:
          type: NodePort
          nodePort: 30030 # Grafana port
        sidecar:
          datasources:
            enabled: true
            searchNamespace: ALL
        additionalDataSources:
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.monitoring.svc.cluster.local:3100
            access: proxy
            isDefault: false
            jsonData:
              maxLines: 1000
      alertmanager:
        enabled: false
      prometheusOperator:
        admissionWebhooks:
          enabled: false
        tls:
          enabled: false
      prometheus:
        service:
          type: NodePort
          nodePort: 30090
        prometheusSpec:
          enableRemoteWriteReceiver: true
          retention: 1d # Data retention for one day
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          serviceMonitorSelector: {}
          podMonitorSelector: {}
# tasks file for roles/prometheus_stack
