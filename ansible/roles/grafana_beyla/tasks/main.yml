---
- name: Add Helm repo for Grafana (Beyla)
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "https://grafana.github.io/helm-charts"

- name: Create observability namespace for Beyla
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Namespace
    name: observability
    state: "{{ stack_state | default('present') }}"

- name: Update Helm repo
  ansible.builtin.command: helm repo update

- name: Install Grafana Beyla (eBPF auto-instrumentation)
  kubernetes.core.helm:
    name: beyla
    chart_ref: grafana/beyla
    release_namespace: observability
    create_namespace: false
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: "{{ stack_state | default('present') }}"
    wait: false
    values:
      preset: daemonset
      hostPID: true
      securityContext:
        privileged: true
        readOnlyRootFilesystem: false
        runAsUser: 0
      extraVolumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
      extraVolumeMounts:
        - name: bpf-fs
          mountPath: /sys/fs/bpf
          mountPropagation: HostToContainer
      config:
        data:
          discovery:
            services:
              - k8s_namespace: default
                namespace: default
          log_level: DEBUG
          attributes:
            kubernetes:
              enable: true
          prometheus_export:
            port: 9090
            path: /metrics
            features:
              - application
              - application_process
              - network
            instrumentations:
              - http
              - grpc
          otel_traces_export:
            endpoint: "http://{{ beyla_traces_endpoint | default('jaeger.observability.svc.cluster.local:4318/v1/traces') }}"
            protocol: http/protobuf
            sampler:
              name: parentbased_traceidratio
              arg: "0.05"

      serviceAccount:
        create: true

      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule

      service:
        create: true
        port: 9090

      serviceMonitor:
        enabled: false

  register: helm_beyla
  until: helm_beyla is not failed
  retries: 5
  delay: 10

- name: Create headless service for Beyla metrics in observability namespace
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: beyla
        namespace: observability
        labels:
          app.kubernetes.io/name: beyla
      spec:
        clusterIP: None
        selector:
          app.kubernetes.io/name: beyla
        ports:
          - name: metrics
            port: 9090
            targetPort: 9090
            protocol: TCP

- name: Create dedicated ServiceMonitor for Beyla in monitoring namespace
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: beyla-monitor
        namespace: monitoring
        labels:
          release: prometheus-stack
      spec:
        namespaceSelector:
          matchNames:
            - observability
        selector:
          matchLabels:
            app.kubernetes.io/name: beyla
        endpoints:
          - port: metrics
            path: /metrics
            interval: 15s

- name: Ensure hostPID is enabled on Beyla DaemonSet
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: beyla
        namespace: observability
      spec:
        template:
          spec:
            hostPID: true
