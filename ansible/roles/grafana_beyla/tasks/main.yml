---
- name: Add Helm repo for Grafana (Beyla)
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "https://grafana.github.io/helm-charts"

- name: Create observability namespace for Beyla
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Namespace
    name: observability
    state: "{{ stack_state | default('present') }}"

- name: Update Helm repo
  ansible.builtin.command: helm repo update

- name: Install Grafana Beyla (eBPF auto-instrumentation)
  kubernetes.core.helm:
    name: beyla
    chart_ref: grafana/beyla
    release_namespace: observability
    create_namespace: false
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: "{{ stack_state | default('present') }}"
    wait: false
    values:
      preset: daemonset
      hostPID: true
      securityContext:
        privileged: true
        readOnlyRootFilesystem: false
        runAsUser: 0
      extraVolumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
      extraVolumeMounts:
        - name: bpf-fs
          mountPath: /sys/fs/bpf
          mountPropagation: HostToContainer
      config:
        data:
          discovery:
            disabled_route_harvesters:
              - java
            services:
              - k8s_namespace: default
                namespace: default
          attributes:
            kubernetes:
              enable: true
          ebpf:
            wakeup_len: 100
          prometheus_export:
            port: 9090
            path: /metrics
            features:
              - application
            instrumentations:
              - http
              - grpc
          otel_traces_export:
            endpoint: "http://{{ beyla_traces_endpoint | default('jaeger.observability.svc.cluster.local:4318/v1/traces') }}"
            protocol: http/protobuf
            sampler:
              name: parentbased_traceidratio
              arg: "0.05"

      serviceAccount:
        create: true

      env:
        BEYLA_JAVAAGENT_ENABLED: "false"

      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule

      service:
        create: true
        port: 9090

      serviceMonitor:
        enabled: true
        labels:
          release: prometheus-stack # Ważne: etykieta używana przez Prometheus Operatora

  register: helm_beyla
  until: helm_beyla is not failed
  retries: 5
  delay: 10

- name: Wait for Beyla DaemonSet rollout to complete
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kind: DaemonSet
    name: beyla
    namespace: observability
  register: beyla_ds
  until:
    - beyla_ds.resources[0].status.numberReady | default(0) > 0
    - beyla_ds.resources[0].status.numberReady == beyla_ds.resources[0].status.desiredNumberScheduled
    - beyla_ds.resources[0].status.numberUnavailable | default(0) == 0
  retries: 20
  delay: 5
