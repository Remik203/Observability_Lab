---
- name: Add Helm repo for Fluent Bit
  kubernetes.core.helm_repository:
    name: fluent
    repo_url: "https://fluent.github.io/helm-charts"

- name: Create logging namespace
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Namespace
    name: logging
    state: "{{ stack_state | default('present') }}"

- name: Install Fluent Bit as DaemonSet
  kubernetes.core.helm:
    name: fluent-bit
    chart_ref: fluent/fluent-bit
    release_namespace: logging
    create_namespace: false
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    chart_version: "{{ fluent_bit_chart_version }}"
    state: "{{ stack_state | default('present') }}"
    wait: true
    values:
      kind: DaemonSet
      resources:
        requests:
          cpu: "20m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      serviceAccount:
        create: true
      config:
        service: |
          [SERVICE]
              Flush         5
              Daemon        Off
              Log_Level     warn
              Parsers_File  /fluent-bit/etc/parsers.conf
              HTTP_Server   On
              HTTP_Listen   0.0.0.0
              HTTP_Port     2020
              storage.type  memory
        inputs: |
          [INPUT]
              Name              tail
              Tag               kube.*
              Path              /var/log/containers/*.log
              multiline.parser  cri
              Mem_Buf_Limit     8MB
              Skip_Long_Lines   On
              Refresh_Interval  10
        filters: |
          [FILTER]
              Name                kubernetes
              Match               kube.*
              Kube_URL            https://kubernetes.default.svc:443
              Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
              Kube_Tag_Prefix     kube.var.log.containers.
              Merge_Log           On
              Merge_Log_Key       log_processed
              Keep_Log            Off
              K8S-Logging.Parser  On
              K8S-Logging.Exclude On
              Kube_Meta_Cache_TTL 300
        outputs: |
          [OUTPUT]
              Name            loki
              Match           kube.*
              Host            {{ loki_service_host }}
              Port            {{ loki_service_port }}
              Labels          job=fluent-bit,node=${NODE_NAME}
              Label_Keys      $kubernetes['namespace_name'],$kubernetes['pod_name']
              Remove_Keys     kubernetes,stream
              line_format     json
              Auto_Kubernetes_Labels Off
      volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true

      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      rbac:
        create: true
        nodeAccess: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      serviceMonitor:
        enabled: true
        namespace: monitoring
        interval: 30s
  register: helm_fluent_bit
  until: helm_fluent_bit is not failed
  retries: 5
  delay: 10

# tasks file for roles/fluent_bit
