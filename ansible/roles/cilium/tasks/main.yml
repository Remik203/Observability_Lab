---
- name: Download Prometheus ServiceMonitor CRD safely
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml"
    dest: "/tmp/prometheus_servicemonitor_crd.yaml"
    mode: '0644'

- name: Pre-install Prometheus ServiceMonitor CRD
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/prometheus_servicemonitor_crd.yaml
  register: crd_install_result
  changed_when: "'created' in crd_install_result.stdout or 'configured' in crd_install_result.stdout"

- name: Install Cilium CLI
  ansible.builtin.shell: |
    CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
    CLI_ARCH=amd64
    if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
    curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
    sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
    sudo tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
    rm cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
  args:
    executable: /bin/bash
    creates: /usr/local/bin/cilium

- name: Install Cilium via CLI
  ansible.builtin.command: >
    cilium install
    --set operator.replicas=1
    --set hubble.relay.enabled=true
    --set hubble.ui.enabled=true
    --set hubble.ui.service.type=NodePort
    --set hubble.ui.service.nodePort=30087
    --set prometheus.enabled=true
    --set prometheus.serviceMonitor.enabled=true
    --set operator.prometheus.enabled=true
    --set hubble.metrics.enabled="{dns,drop,tcp,flow,port-distribution,icmp,http}"
    --set kubeProxyReplacement=false
    --set k8sServiceHost={{ hostvars[groups['k3s_cluster'][0]]['ansible_facts']['default_ipv4']['address'] }}
    --set k8sServicePort=6443
    --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cilium_install
  until: cilium_install.rc == 0
  retries: 3
  delay: 10

# tasks file for roles/cilium
